repo: https://github.com/browsersolver/hermes-plugin-browsersolver
sha: 621dd1ce57ea909efa08f89b588211bf804d9ae1
version: "1.1.0"
description: "Fetch web pages behind Cloudflare, DataDome and similar protections for the built-in web_extract tool, through the BrowserSolver web unlocker API. Extract only; pair it with a search backend for web_search. Disclosure — sends each URL to api.browsersolver.com with your BROWSERSOLVER_API_KEY so BrowserSolver fetches the page past Cloudflare, DataDome and similar bot protection; the default engine is webunlocker, the most expensive tier, and calls use BrowserSolver credits (set engine to crawler or rendering for cheaper fetches). Reads the key only through Hermes's secret scope. Registers no tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: browsersolver
tier: community
category: web
requires_hermes: ">=0.21.6"
